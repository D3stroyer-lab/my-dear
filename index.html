<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ My Dear Wife I Love You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    *{margin:0;
      padding:0;
      box-sizing:border-box
     }
    body{
      font-family:Poppins,sans-serif;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
      overflow-x:hidden;
      color:#fff;
      text-align:center;
      }
    .hearts{
      position:fixed;
       width:100%;
       height:100%;
       top:0;
      left:0;
     overflow:hidden;
       z-index:-1;
                          }
    .hearts span{
      position:absolute;
      display:block;
      font-size:20px;
      animation:float 10s linear infinite;
      opacity:.8;
    }
    
    @keyframes float{
      0%{transform:translateY(100vh) scale(.5);
         opacity:0}
      
      100%{transform:translateY(-10vh) scale(1.5);
           opacity:1}
    }
    
    .container{
      padding:40px 20px;
      max-width:900px;
      margin:auto;}
    
    h1{
      font-family:'Great Vibes',cursive;
      font-size:60px;
      margin-top:30px;
      text-shadow:0 0 20px #ff0066;
    }
    
    h2{
      font-weight:300;
      margin-top:15px;
    }
    
    .heart{
      font-size:100px;
      animation:beat 1s infinite;
    }
    
    @keyframes beat{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.2)}
    }
    
    button{margin-top:30px;
           padding:15px 40px;
           font-size:20px;
           border:none;
           border-radius:50px;
           background:#ff1744;
           color:#fff;
           cursor:pointer;
           box-shadow:0 0 20px rgba(255,0,80,.5);
           transition:.3s;
          }
    
    button:hover{
      transform:scale(1.05);
    }
    
    .card{
      display:none;
      background:rgba(255,255,255,.15);
      backdrop-filter:blur(12px);
      padding:35px;
      border-radius:20px;
      margin-top:40px;
      line-height:1.9;
      font-size:20px;
    }
    
    iframe{
      margin-top:30px;
      width:100%;
      height:500px;
      border:none;
      border-radius:20px;
    }
    
    .footer{
      margin:50px 0;
      font-size:28px;
      font-family:'Great Vibes',cursive;
    }
  
  </style>
    
    </head>
  <body>
    <div class="hearts" id="hearts"></div>
    <div class="container"><div class="heart">❤️</div>
      <h1>My Dear Wife
        <br>I Love You!</h1>
      <h2>A little surprise made especially for the love of my life.</h2>
      <button onclick="openLove()">❤️ Open My Heart ❤️</button>
      <div class="card" id="loveCard">
        <h1>My Dearest Wife ❤️</h1>
        <p id="message"></p>
        <button onclick="playVideo()">🎥 Watch Our Special Video</button>
        <div id="video"></div>
        <div class="footer">❤️ I Love You Today, Tomorrow & Forever ❤️</div>
      </div>
    </div>
    <script>
const text = `Every day with you is the most beautiful chapter of my life.

Your smile fills my heart with happiness, your love gives me strength, and your presence makes every moment special.

Thank you for standing beside me through every joy and every challenge.

You are not only my wife, but also my best friend, my greatest blessing, and the love of my life.

No matter what happens, I promise to love you, respect you, support you, and choose you every single day.

I love you more than words can ever express.

Forever Yours ❤️`;


function openLove() {

    if (typeof confetti === "function") {
        confetti({
            particleCount: 250,
            spread: 180
        });
    }

    document.getElementById("loveCard").style.display = "block";

    let i = 0;
    let msg = document.getElementById("message");
    msg.innerHTML = "";

    let timer = setInterval(function () {

        msg.innerHTML += text.charAt(i);

        i++;

        if (i >= text.length) {
            clearInterval(timer);
        }

    }, 35);
}


function playVideo() {

    if (typeof confetti === "function") {
        confetti({
            particleCount: 300,
            spread: 180
        });
    }

    document.getElementById("video").innerHTML = `
    <iframe 
    src="https://www.youtube.com/embed/BqRyXz0vO0k?autoplay=1"
    allow="autoplay; encrypted-media"
    allowfullscreen>
    </iframe>`;
}


// Floating hearts

for(let i = 0; i < 40; i++){

    let s = document.createElement("span");

    s.innerHTML = "❤️";

    s.style.left = Math.random()*100 + "%";

    s.style.animationDuration = (5 + Math.random()*8) + "s";

    s.style.fontSize = (15 + Math.random()*35) + "px";

    s.style.animationDelay = Math.random()*8 + "s";

    document.getElementById("hearts").appendChild(s);
}

</script>
  </body>
</html>
