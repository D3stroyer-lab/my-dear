"<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ My Dear Wife I Love You ❤️</title>
  <link href="[https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap\](https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap\)" rel="stylesheet">
  <script src="[https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js\">](https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js\%22>)</script>
  <style>
    *{margin:0;
      padding:0;
      box-sizing:border-box}
    body{font-family:Poppins,sans-serif;
           background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
           overflow-x:hidden;
         color:#fff;
         text-align:center;
           }
    .hearts{position:fixed;
                          width:100%;
                          height:100%;
                          top:0;
                          left:0;
                          overflow:hidden;
                          z-index:-1;
                          }
    \n.hearts span{\nposition:absolute;\ndisplay:block;\nfont-size:20px;\nanimation:float 10s linear infinite;\nopacity:.8;\n}\n@keyframes float{\n0%{transform:translateY(100vh) scale(.5);opacity:0}\n100%{transform:translateY(-10vh) scale(1.5);opacity:1}\n}\n\n.container{\npadding:40px 20px;\nmax-width:900px;\nmargin:auto;\n}\n\nh1{\nfont-family:'Great Vibes',cursive;\nfont-size:60px;\nmargin-top:30px;\ntext-shadow:0 0 20px #ff0066;\n}\n\nh2{\nfont-weight:300;\nmargin-top:15px;\n}\n\n.heart{\nfont-size:100px;\nanimation:beat 1s infinite;\n}\n\n@keyframes beat{\n0%,100%{transform:scale(1)}\n50%{transform:scale(1.2)}\n}\n\nbutton{\nmargin-top:30px;\npadding:15px 40px;\nfont-size:20px;\nborder:none;\nborder-radius:50px;\nbackground:#ff1744;\ncolor:#fff;\ncursor:pointer;\nbox-shadow:0 0 20px rgba(255,0,80,.5);\ntransition:.3s;\n}\nbutton:hover{\ntransform:scale(1.05);\n}\n\n.card{\ndisplay:none;\nbackground:rgba(255,255,255,.15);\nbackdrop-filter:blur(12px);\npadding:35px;\nborder-radius:20px;\nmargin-top:40px;\nline-height:1.9;\nfont-size:20px;\n}\n\niframe{\nmargin-top:30px;\nwidth:100%;\nheight:500px;\nborder:none;\nborder-radius:20px;\n}\n\n.footer{\nmargin:50px 0;\nfont-size:28px;\nfont-family:'Great Vibes',cursive;\n}\n</style>\n</head>\n<body>\n\n<div class="hearts" id="hearts"></div>\n\n<div class="container">\n\n<div class="heart">❤️</div>\n\n<h1>My Dear Wife<br>I Love You!</h1>\n\n<h2>A little surprise made especially for the love of my life.</h2>\n\n<button onclick="openLove()">❤️ Open My Heart ❤️</button>\n\n<div class="card" id="loveCard">\n\n<h1>My Dearest Wife ❤️</h1>\n\n<p id="message"></p>\n\n<button onclick="playVideo()">🎥 Watch Our Special Video</button>\n\n<div id="video"></div>\n\n<div class="footer">\n❤️ I Love You Today, Tomorrow & Forever ❤️\n</div>\n\n</div>\n\n</div>\n\n<script>\nconst text=`Every day with you is the most beautiful chapter of my life.\n\nYour smile fills my heart with happiness, your love gives me strength, and your presence makes every moment special.\n\nThank you for standing beside me through every joy and every challenge.\n\nYou are not only my wife, but also my best friend, my greatest blessing, and the love of my life.\n\nNo matter what happens, I promise to love you, respect you, support you, and choose you every single day.\n\nI love you more than words can ever express.\n\nForever Yours ❤️`;\n\nfunction openLove(){\nconfetti({particleCount:250,spread:180});\ndocument.getElementById('loveCard').style.display='block';\nlet i=0;\nlet speed=35;\nlet msg=document.getElementById('message');\nmsg.innerHTML='';\nlet timer=setInterval(()=>{\nmsg.innerHTML+=text.charAt(i).replace('\n','<br>');\ni++;\nif(i>=text.length)clearInterval(timer);\n},speed);\n}\n\nfunction playVideo(){\nconfetti({particleCount:300,spread:180});\ndocument.getElementById('video').innerHTML=`\n<iframe src=\"https://www.youtube.com/embed/BqRyXz0vO0k?autoplay=1\" allow=\"autoplay; encrypted-media\" allowfullscreen></iframe>`;\n}\n\nfor(let i=0;i<40;i++){\nlet s=document.createElement('span');\ns.innerHTML='❤️';\ns.style.left=Math.random()*100+'%';\ns.style.animationDuration=(5+Math.random()*8)+'s';\ns.style.fontSize=(15+Math.random()*35)+'px';\ns.style.animationDelay=Math.random()*8+'s';\ndocument.getElementById('hearts').appendChild(s);\n}\n</script>\n\n</body>\n</html>"}
